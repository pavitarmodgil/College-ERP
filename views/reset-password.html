<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — UniPortal</title>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
<text y=%22.9em%22 font-size=%2290%22>🎓</text>
</svg>">
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="reset-root">
  <div class="reset-card">
    <span class="reset-icon">🔐</span>
    <h1 style="font-size:1.7rem;font-weight:800;color:var(--ink);margin-bottom:6px">Set New Password</h1>
    <p style="font-size:14px;color:var(--muted);margin-bottom:22px">
      Welcome, <strong id="resetUserName">…</strong>! This is your first login.
      Please replace your temporary password with a permanent one.
    </p>

    <div class="reset-notice">
      ⚠️ You must set a new password before accessing your dashboard.
    </div>

    <div id="alertMsg" class="alert" role="alert"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input type="password" id="newPassword" placeholder="Minimum 6 characters" autocomplete="new-password"/>
          <button type="button" class="eye-btn" data-target="newPassword">👁️</button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password"/>
          <button type="button" class="eye-btn" data-target="confirmPassword">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn" style="margin-top:8px">
        <span class="btn-text">Set Password & Continue →</span>
        <div class="spinner"></div>
      </button>
    </form>

    <p style="font-size:12.5px;color:var(--faint);margin-top:18px;text-align:center;line-height:1.5">
      After setting your password you'll be redirected to your dashboard.
    </p>
  </div>
</div>
<script src="/js/script.js"></script>
</body>
</html>
