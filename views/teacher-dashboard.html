<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Dashboard — UniPortal</title>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
<text y=%22.9em%22 font-size=%2290%22>🎓</text>
</svg>">
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-root" id="teacherDashboard">

  <!-- Topbar -->
  <header class="topbar">
    <a href="/" class="topbar-brand"><div class="tb-box">🎓</div>Uni<span>Portal</span></a>
    <div class="topbar-right">
      <div class="topbar-user">
        <div class="avatar avatar-teacher" data-user-initial>T</div>
        <div class="user-info">
          <span class="uname" data-user-name>Teacher</span>
          <span class="urole urole-teacher">📚 Faculty</span>
        </div>
      </div>
      <button class="btn btn-danger btn-sm" data-logout>Logout</button>
    </div>
  </header>

  <main class="page-body">

    <!-- Banner -->
    <div class="banner banner-teacher">
      <div class="banner-bg"></div>
      <div class="banner-grid"></div>
      <div class="banner-inner">
        <div>
          <p style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:5px">Faculty Dashboard</p>
          <h1>Welcome, <em class="c-teacher" data-user-name>Teacher</em> 👋</h1>
          <p>Dept: <strong style="color:rgba(255,255,255,.7)" data-dept>—</strong> &nbsp;|&nbsp; <span data-user-email style="color:rgba(255,255,255,.5)"></span></p>
        </div>
        <div class="banner-emoji">📚</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stat-row cols-2" style="margin-bottom:28px;max-width:480px">
      <div class="scard">
        <div class="scard-icon" style="background:var(--student-bg)">🎓</div>
        <div class="scard-num" id="countStudents">—</div>
        <div class="scard-label">Total Students</div>
        <div class="scard-chip" style="background:var(--student-bg);color:var(--student)">Enrolled</div>
      </div>
      <div class="scard">
        <div class="scard-icon" style="background:var(--teacher-bg)">🏛️</div>
        <div class="scard-num" data-dept>—</div>
        <div class="scard-label">Your Department</div>
      </div>
    </div>

    <!-- Quick Action -->
    <div class="sec-row"><h2 class="sec-title">Quick Actions</h2></div>
    <div class="action-row" style="max-width:500px">
      <a href="/view-students" class="acard teacher-acard">
        <div class="acard-icon" style="background:var(--student-bg)">👥</div>
        <div class="acard-body">
          <h3>View Student Directory</h3>
          <p>Browse all enrolled students with their IDs, departments, and password status.</p>
        </div>
        <div class="acard-arrow">→</div>
      </a>
    </div>

  </main>
</div>
<script src="/js/script.js"></script>
</body>
</html>
