<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Directory — UniPortal</title>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
<text y=%22.9em%22 font-size=%2290%22>🎓</text>
</svg>">
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-root" id="viewStudentsPage">

  <!-- Topbar -->
  <header class="topbar">
    <a href="/teacher-dashboard" class="topbar-brand"><div class="tb-box">🎓</div>Uni<span>Portal</span></a>
    <div class="topbar-right">
      <div class="topbar-user">
        <div class="avatar avatar-teacher" data-user-initial>T</div>
        <div class="user-info">
          <span class="uname" data-user-name>Teacher</span>
          <span class="urole urole-teacher">📚 Faculty</span>
        </div>
      </div>
      <a href="/teacher-dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
      <button class="btn btn-danger btn-sm" data-logout>Logout</button>
    </div>
  </header>

  <main class="page-body">
    <div style="margin-bottom:28px;animation:fadeSlide .35s ease both">
      <h1 style="font-size:1.9rem;font-weight:800;color:var(--ink);margin-bottom:4px">Student Directory</h1>
      <p style="font-size:14px;color:var(--muted)">All enrolled students, filtered from the system.</p>
    </div>

    <div class="table-shell">
      <div class="table-head">
        <div class="t-search">
          <span>🔍</span>
          <input type="text" id="tableSearch" placeholder="Search name, ID, email, department…"/>
        </div>
        <span class="t-count" id="tableCount">Loading…</span>
      </div>
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Password</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr id="tableLoading">
              <td colspan="5" style="text-align:center;color:var(--muted);padding:32px;font-size:14px">
                ⏳ Loading students…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/js/script.js"></script>
</body>
</html>
